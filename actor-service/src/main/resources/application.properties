# ============================================================
# Actor Service - application.properties
# Default config uses H2 for local development.
# Docker overrides these via environment variables in docker-compose.yml.
# ============================================================

spring.application.name=actor-service

# Run on port 8080 (default)
server.port=8080

# --- H2 In-Memory Database (local dev only) ---
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:actordb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=embedded

# ============================================================
# Keep Spring MVC (Tomcat) as the web server even though
# we added the WebFlux dependency for WebClient.
# Without this, Spring Boot would switch to Netty (reactive server).
# ============================================================
spring.main.web-application-type=servlet

# ============================================================
# URL of the Movie service.
# Local dev:  http://localhost:8081
# Docker:     overridden by MOVIE_SERVICE_URL env var in docker-compose.yml
#             which Spring Boot maps to this property automatically.
# ============================================================
movie.service.url=http://localhost:8081