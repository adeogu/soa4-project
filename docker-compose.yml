
# one command: docker-compose up --build
version: '3.8'

services:

  # ── MySQL for Actor service ──────────────────────────────────
  actor-db:
    image: mysql:8.0
    container_name: actor-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: actordb
      MYSQL_USER: actor_user
      MYSQL_PASSWORD: actor_pass
    ports:
      - "3307:3306" 
    volumes:
      - actor-db-data:/var/lib/mysql 
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MySQL for Movie service ──────────────────────────────────
  movie-db:
    image: mysql:8.0
    container_name: movie-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: moviedb
      MYSQL_USER: movie_user
      MYSQL_PASSWORD: movie_pass
    ports:
      - "3308:3306"
    volumes:
      - movie-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Movie Service (Service B / Producer) ─────────────────────
  movie-service:
    build:
      context: ./movie-service # path to the Dockerfile
    container_name: movie-service
    ports:
      - "8081:8081"
    depends_on:
      movie-db:
        condition: service_healthy 
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://movie-db:3306/moviedb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: movie_user
      SPRING_DATASOURCE_PASSWORD: movie_pass
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
      SPRING_JACKSON_PROPERTY_NAMING_STRATEGY: LOWER_CAMEL_CASE

      SPRING_JPA_HIBERNATE_DDL_AUTO: create
      SPRING_SQL_INIT_MODE: always   

  # ── Actor Service (Service A / Consumer) ─────────────────────
  actor-service:
    build:
      context: ./actor-service
    container_name: actor-service
    ports:
      - "8080:8080"
    depends_on:
      actor-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://actor-db:3306/actordb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: actor_user
      SPRING_DATASOURCE_PASSWORD: actor_pass
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
      SPRING_JACKSON_PROPERTY_NAMING_STRATEGY: LOWER_CAMEL_CASE

      SPRING_JPA_HIBERNATE_DDL_AUTO: create
      SPRING_SQL_INIT_MODE: always     
      MOVIE_SERVICE_URL: http://movie-service:8081
      SPRING_MAIN_WEB_APPLICATION_TYPE: servlet

volumes:
  actor-db-data:
  movie-db-data:
