# ============================================================
# Movie Service - application.properties
# Default config uses H2 for local development.
# Docker overrides these via environment variables in docker-compose.yml.
# ============================================================

spring.application.name=movie-service

# Run on port 8081 so it doesn't clash with actor-service on 8080
server.port=8081

# --- H2 In-Memory Database (local dev only) ---
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:moviedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# create-drop: creates schema on startup, drops on shutdown (fine for H2)
spring.jpa.hibernate.ddl-auto=create-drop

# Ensures data.sql runs AFTER JPA creates the schema
spring.jpa.defer-datasource-initialization=true

# Only run data.sql for embedded (H2) databases \u2014 skipped in Docker
spring.sql.init.mode=embedded